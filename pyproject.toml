[project]
name = "duhub-cli"
version = "0.1.0"
description = "DUhub CLI — STT, TTS, MT and diarization over your API key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
authors = [{ name = "Digital Umuganda" }]
keywords = ["kinyarwanda", "stt", "tts", "translation", "diarization", "speech"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.11"
dependencies = ["typer>=0.9", "rich>=13", "httpx>=0.27"]

[project.urls]
Homepage = "https://beta.duhub.ai"
Repository = "https://github.com/Digital-Umuganda/duhub-cli"
Issues = "https://github.com/Digital-Umuganda/duhub-cli/issues"

[project.scripts]
du = "du_cli.main:app"
duhub = "du_cli.main:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["du_cli*"]

[dependency-groups]
dev = ["pytest", "respx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
