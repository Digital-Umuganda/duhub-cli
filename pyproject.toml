[project]
name = "du-cli"
version = "0.1.0"
description = "DU Speech Platform CLI — STT, TTS, MT and diarization over your API key."
requires-python = ">=3.11"
dependencies = ["typer>=0.9", "rich>=13", "httpx>=0.27"]

[project.scripts]
du = "du_cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["du_cli*"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
